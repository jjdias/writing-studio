# What cargo-about reads to write THIRD-PARTY-NOTICES.html, the notice
# every package carries: each crate the program is built from, with its
# license text. Build and test dependencies are not in the program, so they
# are left out. A crate under a license not listed here stops the build,
# so a new kind of license is a decision, not an accident.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "zlib-acknowledgement",
    "0BSD",
    "MIT-0",
    "CC0-1.0",
    "Unlicense",
    # Weak copyleft, used unchanged: spellbook and option-ext. The notice
    # says where their source is.
    "MPL-2.0",
]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
