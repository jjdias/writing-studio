# Build the packages: a Windows installer and a portable zip, and a Linux
# .deb. It runs when what goes into a package changes, by hand from the
# Actions tab, and from the Release workflow, which attaches the packages to
# a GitHub Release. An AppImage is bonus work (roadmap/todo/bonus.md).
name: Package

on:
  workflow_dispatch:
  # The Release workflow builds its packages with this one.
  workflow_call:
  push:
    paths:
      - .github/workflows/package.yml
      - about.toml
      - about.hbs
      - LICENSE-*
      - apps/desktop/**
      - crates/**
      - Cargo.toml
      - Cargo.lock

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            types: --package-types msi
          - os: ubuntu-latest
            types: --package-types deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev

      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # The CLI that builds the packages, at the Dioxus version in Cargo.lock,
      # as the binary Dioxus publishes with each release. Compiling it fails
      # on Windows: its TLS library does not build with the runner's compiler.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      - name: Install the Dioxus CLI
        run: cargo binstall dioxus-cli@0.6.3 --no-confirm --disable-strategies compile

      # The licenses every package carries: the program's own, the
      # dictionary's, the Markdown editor's (CodeMirror, a script the page
      # carries, which cargo-about does not see), and a notice of every crate the program is built from
      # (about.toml lists the licenses it may be under).
      - name: Licenses
        shell: bash
        run: |
          # Compiled, as there is no published binary for every runner, and
          # its command is behind the `cli` feature.
          cargo install cargo-about --version 0.9.3 --locked --features cli
          mkdir -p apps/desktop/package-files/licenses
          cp LICENSE-MIT LICENSE-APACHE apps/desktop/package-files/licenses/
          cp crates/spellcheck/dictionaries/en_US.LICENSE.txt apps/desktop/package-files/licenses/dictionary-LICENSE.txt
          cp crates/ui/codemirror/LICENSES.txt apps/desktop/package-files/licenses/editor-LICENSES.txt
          cargo about generate --manifest-path apps/desktop/Cargo.toml about.hbs --output-file apps/desktop/package-files/licenses/THIRD-PARTY-NOTICES.html

      - name: Bundle
        working-directory: apps/desktop
        run: dx bundle --platform desktop --package writing-studio-desktop ${{ matrix.types }} --out-dir ../../dist

      # dx drops what WiX prints, so a failed installer says only that
      # light.exe failed. This runs it again, as the bundler does, to show why.
      - name: Why the installer failed
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $wix = "$env:LOCALAPPDATA\tauri\WixTools314"
          $obj = Get-ChildItem target -Recurse -Filter main.wixobj | Select-Object -First 1
          if (-not $obj) { Write-Output "No main.wixobj: the failure came before WiX."; exit 0 }
          Set-Location $obj.DirectoryName
          Get-ChildItem | Format-Table Name, Length
          & "$wix\light.exe" -ext "$wix\WixUIExtension.dll" -ext "$wix\WixUtilExtension.dll" -o check.msi -cultures:en-us -loc locale.wxl *.wixobj
          Write-Output "light.exe exited with $LASTEXITCODE"

      # The same program as the installer, to run from any folder.
      - name: Portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem target -Recurse -Filter writing-studio.exe |
            Where-Object { $_.FullName -match '\\release\\' } |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $folder = New-Item -ItemType Directory -Force "dist/Writing Studio"
          Copy-Item $exe.FullName "$folder/Writing Studio.exe"
          Copy-Item -Recurse apps/desktop/package-files/licenses "$folder/licenses"
          Compress-Archive -Path $folder -DestinationPath "dist/Writing-Studio-windows-x64-portable.zip"
          Remove-Item -Recurse $folder

      - name: Sizes
        shell: bash
        run: ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
