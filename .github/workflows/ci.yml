# Build the workspace and run every test on Windows and on Linux, on each
# push and pull request. The repository is public, so this costs nothing.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental builds only help a computer that builds again; CI starts clean.
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The window is WebKitGTK on Linux, and Dioxus desktop's menus use GTK
      # and libxdo.
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev

      # rust-toolchain.toml names the stable channel; this installs it.
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      # Dioxus's rsx! writes different code without debug assertions, so a
      # mistake can pass the build above and fail only in the packaged one.
      - name: Check the release build
        run: cargo check --workspace --release --locked

  # The Markdown page's JavaScript: its tests, and that the bundle the program
  # carries is the one its sources make. The page is the same on every
  # system, so one run is enough.
  page:
    name: Page
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/ui/codemirror
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/ui/codemirror/package-lock.json

      - name: Install the pinned packages
        run: npm ci

      - name: Test
        run: npm test

      # A change to the sources must be built and committed with them, or
      # the program ships the page as it was.
      - name: The committed bundle is the one the sources make
        run: |
          npm run build
          git diff --exit-code -- ../assets/codemirror.js LICENSES.txt || {
            echo "::error::crates/ui/assets/codemirror.js or LICENSES.txt is not what the sources make. Run npm run build in crates/ui/codemirror and commit both."
            exit 1
          }
